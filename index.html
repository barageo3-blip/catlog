<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b7568">
<title>福ちゃんの体重・健康管理</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f5f6f2;--card:#fff;--ink:#25332c;--muted:#718078;--accent:#5b7568;--accent2:#e5eee8;--line:#e4e9e4;--danger:#b64c4c;--shadow:0 5px 18px #26352b0c}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family: "Hiragino Kaku Gothic ProN", "Meiryo UI", Meiryo, system-ui, -apple-system, sans-serif;
  padding-bottom:88px;
}
header{background:var(--accent);color:white;padding:22px 18px 18px;border-radius:0 0 22px 22px}
header .top{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:23px;margin:0;font-weight:750}header p{margin:6px 0 0;color:#e5eee8;font-size:12px}
main{max-width:720px;margin:auto;padding:16px}section{display:none}section.active{display:block}.card{background:var(--card);border-radius:17px;padding:16px;margin:0 0 14px;box-shadow:var(--shadow);border:1px solid #edf0ec}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.muted{color:var(--muted);font-size:12px}.big{font-size:32px;font-weight:750;letter-spacing:-1px}.unit{font-size:14px;color:var(--muted);font-weight:500}.pill{background:var(--accent2);color:var(--accent);border-radius:99px;padding:5px 10px;font-size:11px;font-weight:700}
h2{font-size:17px;margin:0 0 13px}h3{font-size:14px;margin:0 0 8px}
button,.btn{border:0;border-radius:12px;background:var(--accent);color:white;padding:11px 14px;font-weight:700;font-size:13px;cursor:pointer}
button.secondary,.btn.secondary{background:var(--accent2);color:var(--accent)}button.ghost{background:transparent;color:var(--accent);padding:7px}button.danger{background:#faeaea;color:var(--danger)}button.small{padding:7px 10px;font-size:12px}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:white;color:var(--ink);font:inherit;font-size:14px;margin-top:5px}
textarea{min-height:82px;resize:vertical}label{display:block;font-size:12px;font-weight:700;color:#526159;margin:12px 0 0}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid .full{grid-column:1/-1}
nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom))}
nav button{background:transparent;color:var(--muted);flex:1;max-width:150px;padding:8px 3px;font-size:11px}nav button.active{color:var(--accent);background:var(--accent2)}
nav .ico{display:block;font-size:19px;margin-bottom:2px}
canvas { width: 100%; height: 230px; display: block; background: #ffffff; border-radius: 12px; padding: 8px; opacity: 0.95; }
.record{padding:12px 0;border-top:1px solid var(--line)}.record:first-child{border-top:0}.record .date{font-size:12px;color:var(--muted)}
.photo{width:62px;height:62px;object-fit:cover;border-radius:10px;background:var(--accent2)}
.empty{text-align:center;padding:28px 10px;color:var(--muted);font-size:13px}
.notice{font-size:12px;color:var(--muted);line-height:1.6;background:#f3f6f2;border-radius:10px;padding:10px}
#toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:#25332c;color:white;padding:10px 16px;border-radius:99px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:10}#toast.show{opacity:1}
@media(min-width:600px){main{padding:22px}.formgrid{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>
<body>
<header><div class="top"><div><h1>🐾 福ちゃんの体重記録</h1><p>福ちゃんの体重と健康の記録</p></div><span class="pill" style="background:#ffffff25;color:white">端末内保存</span></div></header>
<main>
<section id="home" class="active">
 <div class="card">
  <div class="row between"><div><div class="muted">最新の体重</div><div class="big" id="latestWeight">-- <span class="unit">kg</span></div><div class="muted" id="latestDate">まだ記録がありません</div></div><div style="text-align:right"><div class="muted">目標体重</div><div style="font-size:21px;font-weight:700" id="goalDisplay">未設定</div><button class="ghost small" onclick="showTab('settings')">設定する</button></div></div>
 </div>
 <div class="card"><div class="row between"><h2>体重の推移</h2><span class="pill">直近12か月</span></div><canvas id="homeChart" width="650" height="260"></canvas><div class="muted" id="chartHint">体重を登録するとグラフが表示されます。</div></div>
 <div class="card"><div class="row between"><h2>最近の記録</h2><button class="secondary small" onclick="showTab('records')">すべて見る</button></div><div id="recentList"></div></div>
 <button style="width:100%;padding:15px" onclick="newRecord()">＋ 体重を記録する</button>
</section>
<section id="records">
 <div class="row between" style="margin:4px 0 14px"><h2>記録一覧</h2><button onclick="newRecord()">＋ 新規記録</button></div>
 <div class="card"><div id="recordList"></div></div>
</section>
<section id="compare">
 <div class="card">
  <h2>年度別の体重比較</h2>
  <div class="formgrid"><div><label>比較する年度①</label><select id="yearA" onchange="drawCompare()"></select></div><div><label>比較する年度②</label><select id="yearB" onchange="drawCompare()"></select></div></div>
  <canvas id="compareChart" width="650" height="280"></canvas>
 </div>
</section>
<section id="settings">
 <div class="card"><h2>基本設定</h2>
  <label>猫ちゃんの名前</label><input id="catName" placeholder="例：ミーちゃん">
  <label>目標体重（kg）</label><input id="goal" type="number" step="0.01" min="0" placeholder="例：5.0">
  <button style="width:100%;margin-top:14px" onclick="saveSettings()">設定を保存</button>
 </div>
 
 <!-- 💾 新しく整理したデータ管理バックアップエリア -->
 <div class="card"><h2>データのバックアップ</h2>
  <button style="width:100%;margin-bottom:8px" id="btnExport">全データを保存（バックアップ）</button>
  <button class="secondary" style="width:100%;margin-bottom:8px" id="btnImportTrigger">データを読み込む（復元）</button>
  <input type="file" id="fileImport" accept=".json,application/json" style="display:none">
  <button class="ghost" style="width:100%;font-size:12px;color:var(--muted)" onclick="exportCSV()">CSVファイルを書き出す</button>
 </div>
</section>
</main>
<nav>
 <button class="active" data-tab="home" onclick="showTab('home')"><span class="ico">⌂</span>ホーム</button>
 <button data-tab="records" onclick="showTab('records')"><span class="ico">▤</span>記録一覧</button>
 <button data-tab="compare" onclick="showTab('compare')"><span class="ico">⌁</span>年度比較</button>
 <button data-tab="settings" onclick="showTab('settings')"><span class="ico">⚙</span>設定</button>
</nav>
<div id="toast"></div>
<script>
const DB='catlog_db_v1';
let data={cats:[{id:'cat1',name:'福ちゃん',goal:'',records:[]}],activeCatId:'cat1'};
let editingId=null;
const $=id=>document.getElementById(id);
const cat=()=>data.cats.find(c=>c.id===data.activeCatId)||data.cats[0];
function load(){try{const x=localStorage.getItem(DB);if(x){const parsed=JSON.parse(x);if(parsed.cats&&parsed.cats.length)data=parsed}}catch(e){}}
function save(){localStorage.setItem(DB,JSON.stringify(data));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function showTab(t){
  document.querySelectorAll('main section').forEach(x=>x.classList.toggle('active',x.id===t));
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));
  if(t==='compare')setupYears();
}
function newRecord(id=null){
  editingId=id; const r=id?cat().records.find(x=>x.id===id):null;
  const date=r?.date||new Date().toISOString().slice(0,10), weight=r?.weight||'', memo=r?.memo||'', health=r?.health||'', photo=r?.photo||'';
  const sheba=r?.sheba!==undefined?r.sheba:5, rc=r?.rc!==undefined?r.rc:15, kan=r?.kan!==undefined?r.kan:20, foodMemo=r?.foodMemo||'';
  const overlay=document.createElement('div'); overlay.id='modal';
  overlay.style='position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:12px';
  overlay.innerHTML=`<div class="card" style="width:100%;max-width:500px;max-height:85vh;overflow-y:auto;margin:0;animation:slide .2s ease-out">
    <h2 style="margin-bottom:5px">${id?'記録の編集':'📄 体重・健康の記録'}</h2>
    <div class="formgrid">
      <div><label>日付</label><input type="date" id="fDate" value="${date}" min="2019-01-01"></div>
      <div><label>体重 (kg)</label><input type="number" id="fWeight" step="0.01" min="0" placeholder="0.00" value="${weight}"></div>
      <div class="full" style="background:#f4f6f3; padding:12px; border-radius:12px; margin-top:10px;">
        <h3 style="color:#4a5d53; margin:0 0 8px 0; font-size:13px;">🍽️ 食事の記録 (デフォルト値自動入力)</h3>
        <div class="formgrid">
          <div><label style="margin-top:0">Sheba (g)</label><input type="number" id="fSheba" value="${sheba}"></div>
          <div><label style="margin-top:0">ロイヤルカナン (g)</label><input type="number" id="fRc" value="${rc}"></div>
          <div><label style="margin-top:0">健康缶 (g)</label><input type="number" id="fKan" value="${kan}"></div>
          <div class="full"><label style="margin-top:4px">食事の例外メモ</label><input type="text" id="fFoodMemo" placeholder="残した量やオヤツなど" value="${esc(foodMemo)}"></div>
        </div>
      </div>
      <div class="full"><label>体調メモ</label><textarea id="fHealth" placeholder="うんちの状態、吐き気、元気など">${esc(health)}</textarea></div>
      <div class="full"><label>その他自由メモ</label><textarea id="fMemo" placeholder="その日のトピックなど">${esc(memo)}</textarea></div>
      <div class="full"><label>福ちゃんの写真 (フォトギャラリーから選択)</label>
        <input type="file" id="fFile" accept="image/*" style="margin-bottom:8px">
        <div style="position:relative;display:inline-block">
          <img id="fPreview" src="${photo}" class="photo" style="width:120px;height:120px;display:${photo?'block':'none'}">
          <button type="button" id="fDelPhoto" class="danger small" style="position:absolute;top:0;right:0;padding:4px 8px;border-radius:6px;display:${photo?'block':'none'}">✕</button>
        </div>
      </div>
    </div>
    <div class="row" style="margin-top:20px;gap:10px">
      <button style="flex:1" onclick="saveRecord()">保存する</button>
      ${id?'<button class="danger" onclick="deleteRecord()">削除</button>':''}
      <button class="secondary" onclick="$('modal').remove()">閉じる</button>
    </div>
  </div><style>@keyframes slide{from{transform:translateY(100%)}to{transform:translateY(0)}}</style>`;
  document.body.appendChild(overlay);
  let currentPhoto=photo;
  $('fFile').onchange=e=>{
    const file=e.target.files; if(!file)return;
    const reader=new FileReader(); reader.onload=evt=>{
      const img=new Image(); img.onload=()=>{
        const canvas=document.createElement('canvas'), ctx=canvas.getContext('2d'), maxW=300;
        let w=img.width, h=img.height; if(w>maxW){ h=Math.round(h*maxW/w); w=maxW }
        canvas.width=w; canvas.height=h; ctx.drawImage(img,0,0,w,h);
        currentPhoto=canvas.toDataURL('image/jpeg',0.7);
        $('fPreview').src=currentPhoto; $('fPreview').style.display='block'; $('fDelPhoto').style.display='block';
      }; img.src=evt.target.result;
    }; reader.readAsDataURL(file);
  };
  $('fDelPhoto').onclick=()=>{ currentPhoto=''; $('fPreview').src=''; $('fPreview').style.display='none'; $('fDelPhoto').style.display='none'; $('fFile').value=''; };
  window.saveRecord=()=>{
    const d=$('fDate').value, w=parseFloat($('fWeight').value); if(!d||isNaN(w)){alert('日付と体重を正しく入力してください');return}
    const rec={
      id:editingId||'r_'+Date.now(), date:d, weight:w, memo:$('fMemo').value, health:$('fHealth').value, photo:currentPhoto,
      sheba:parseFloat($('fSheba').value)||0, rc:parseFloat($('fRc').value)||0, kan:parseFloat($('fKan').value)||0, foodMemo:$('fFoodMemo').value
    };
    if(editingId){ const idx=cat().records.findIndex(x=>x.id===editingId); if(idx>-1)cat().records[idx]=rec }else{ cat().records.push(rec) }
    cat().records.sort((a,b)=>b.date.localeCompare(a.date)); overlay.remove(); save(); toast('記録を保存しました');
    window.saveRecord=null; window.deleteRecord=null;
  };
  window.deleteRecord=()=>{ if(confirm('この記録を削除しますか？')){const idx=cat().records.findIndex(x=>x.id===editingId);if(idx>-1)cat().records.splice(idx,1);overlay.remove();save();toast('削除しました')} window.saveRecord=null; window.deleteRecord=null; };
}
function saveSettings(){ cat().name=$('catName').value||'福ちゃん'; cat().goal=$('goal').value; save(); toast('設定を保存しました') }
function render(){
  const c=cat(); $('catName').value=c.name||'福ちゃん'; $('goal').value=c.goal||''; $('goalDisplay').textContent=c.goal?c.goal+' kg':'未設定';
  const recs=c.records||[];
  if(recs.length){
    $('latestWeight').innerHTML=recs[0].weight+' <span class="unit">kg</span>';
    $('latestDate').textContent=recs[0].date+' の記録';
  }else{
    $('latestWeight').innerHTML='-- <span class="unit">kg</span>'; $('latestDate').textContent='まだ記録がありません';
  }
  let hRecent='', hAll='';
  if(!recs.length){ const empty='<div class="empty">記録がありません</div>'; hRecent=empty; hAll=empty }
  else{
    recs.forEach((r,i)=>{
      const fTxt=`🍽️ S:${r.sheba??5}g / R:${r.rc??15}g / 缶:${r.kan??20}g${r.foodMemo?' ('+r.foodMemo+')':''}`;
      const html=`<div class="record row between" onclick="newRecord('${r.id}')">
        <div class="row" style="flex:1;min-width:0">
          ${r.photo?`<img src="${r.photo}" class="photo">`:'' }
          <div style="flex:1;min-width:0">
            <div class="date" style="font-weight:bold;color:#4a5d53">${r.date}</div>
            <div style="font-size:15px;font-weight:700;margin:2px 0">${r.weight} kg</div>
            <div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${fTxt}</div>
            ${r.health||r.memo?`<div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#8ba396">${esc(r.health||r.memo)}</div>`:''}
          </div>
        </div>
        <span class="muted">＞</span>
      </div>`;
      if(i<3)hRecent+=html; hAll+=html;
    });
  }
  $('recentList').innerHTML=hRecent; $('recordList').innerHTML=hAll;
  const chartItems=recs.slice(0,12).reverse().map(r=>({value:r.weight,label:r.date.slice(5)}));
  $('chartHint').style.display=chartItems.length?'none':'block'; drawChart($('homeChart'),chartItems);
}
function setupYears(){
  const cc=cat().records; const years=new Set(); cc.forEach(r=>years.add(new Date(r.date+'T00:00:00').getFullYear()));
  const arr=Array.from(years).sort((a,b)=>b-a); if(!arr.length)arr.push(new Date().getFullYear());
  let h=''; arr.forEach(y=>h+=`<option value="${y}">${y}年</option>`);
  const ya=$('yearA'), yb=$('yearB'); const valA=ya.value, valB=yb.value; ya.innerHTML=h; yb.innerHTML=h;
  if(valA&&[...ya.options].some(o=>o.value===valA))ya.value=valA;else ya.selectedIndex=0;
  if(valB&&[...yb.options].some(o=>o.value===valB))yb.value=valB;else yb.value=ya.value;
  drawCompare();
}
function drawChart(canvas,items){
  const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height; ctx.clearRect(0,0,w,h); ctx.font='12px sans-serif'; ctx.fillStyle='#718078';
  if(!items.length){ctx.fillText('記録がありません',w/2-50,h/2);return}
  const vals=items.map(x=>x.value),min=Math.min(...vals)-.1,max=Math.max(...vals)+.1,left=48,right=18,top=24,bottom=38;
  ctx.strokeStyle='#edf1ee'; ctx.lineWidth=1;
  for(let i=0;i<5;i++){ let y=top+(h-top-bottom)*i/4; ctx.beginPath(); ctx.moveTo(left,y); ctx.lineTo(w-right,y); ctx.stroke(); ctx.fillText((max-(max-min)*i/4).toFixed(1),8,y+4) }
  const pts=items.map((x,i)=>({x:left+(w-left-right)*(items.length===1?.5:i/(items.length-1)),y:top+(h-top-bottom)*(max-x.value)/(max-min||1)}));
  ctx.strokeStyle='#5b7568'; ctx.lineWidth=3.5; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.stroke();
  pts.forEach((p,i)=>{ ctx.strokeStyle='#5b7568'; ctx.lineWidth=2.5; ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(p.x,p.y,5,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.fillStyle='#718078'; ctx.fillText(items[i].label,p.x-14,h-10) });
}
function drawCompare(){
  const ya=+$('yearA').value,yb=+$('yearB').value; if(!ya)return;
  const monthVals=y=>Array.from({length:12},(_,i)=>{
    const m=(i+3)%12+1, year=m>=4?y:y+1; const rr=cat().records.filter(r=>{ const d=new Date(r.date+'T00:00:00'); return d.getFullYear()===year&&d.getMonth()+1===m }); return rr.length?rr.reduce((s,r)=>s+r.weight,0)/rr.length:null
  });
  const canvas=$('compareChart'),ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height; ctx.clearRect(0,0,w,h);
  const all=[...monthVals(ya),...monthVals(yb)].filter(v=>v!==null); if(!all.length){ctx.fillStyle='#718078';ctx.fillText('記録がありません',w/2-50,h/2);return}
  const min=Math.min(...all)-.1,max=Math.max(...all)+.1,left=48,right=18,top=25,bottom=42;
  ctx.font='11px sans-serif'; ctx.fillStyle='#718078'; ctx.strokeStyle='#edf1ee';
  for(let i=0;i<5;i++){ let y=top+(h-top-bottom)*i/4; ctx.beginPath(); ctx.moveTo(left,y); ctx.lineTo(w-right,y); ctx.stroke(); ctx.fillText((max-(max-min)*i/4).toFixed(1),8,y+4) }
  const months=['4月','5月','6月','7月','8月','9月','10月','11月','12月','1月','2月','3月']; months.forEach((m,i)=>ctx.fillText(m,left+(w-left-right)*i/11-10,h-14));
  [[ya,'#5b7568'],[yb,'#df9f6e']].forEach(([year,color])=>{
    const vals=monthVals(year); ctx.strokeStyle=color; ctx.lineWidth=3; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.beginPath();
    let started=false; const currentPts=[];
    vals.forEach((v,i)=>{ if(v===null){started=false;return} const x=left+(w-left-right)*i/11,y=top+(h-top-bottom)*(max-v)/(max-min||1); currentPts.push({x,y}); if(!started){ctx.moveTo(x,y);started=true}else ctx.lineTo(x,y) });
    ctx.stroke(); currentPts.forEach(p=>{ ctx.strokeStyle=color; ctx.lineWidth=2; ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(p.x,p.y,4,0,Math.PI*2); ctx.fill(); ctx.stroke() });
  });
}
function exportCSV(){
  const c=cat(); if(!c.records.length){toast('記録がありません');return}
  let csv='\ufeff日付,体重(kg),Sheba(g),ロイヤルカナン(g),健康缶(g),食事メモ,体調メモ,その他メモ\n';
  c.records.forEach(r=>csv+=`"${r.date}",${r.weight},${r.sheba||0},${r.rc||0},${r.kan||0},"${(r.foodMemo||'').replace(/"/g,'""')}","${(r.health||'').replace(/"/g,'""')}","${(r.memo||'').replace(/"/g,'""')}"\n`);
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}); const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=`catlog_${c.name}.csv`;link.click();
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const link=document.createElement('a'); link.href=URL.createObjectURL(blob);
  link.download=`fukuchan_backup_${new Date().toISOString().slice(0,10)}.json`; link.click();
  toast('バックアップを保存しました！');
}
function importJSON(e){
  const file=e.target.files; if(!file||!file.length)return; const reader=new FileReader();
  reader.onload=evt=>{
    try {
      const parsed=JSON.parse(evt.target.result);
      if(parsed.cats && confirm('データを復元しますか？現在のデータは上書きされます。')){
        data=parsed; save(); toast('復元しました！'); render();
      } else { toast('無効な形式です') }
    } catch(err) { toast('読み込みに失敗しました') }
  };
  reader.readAsText(file[0]);
}

document.getElementById('btnExport').addEventListener('click', exportJSON);
document.getElementById('btnImportTrigger').addEventListener('click', () => document.getElementById('fileImport').click());
document.getElementById('fileImport').addEventListener('change', importJSON);

load(); render();
</script>
</body>
</html>
